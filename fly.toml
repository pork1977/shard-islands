# Fly.io configuration for the realtime server.
#
# Deployed from the repository root:
#   fly deploy
#
# App name and region are set here rather than passed on the command line so
# that a deploy is the same deploy whoever runs it.

app = "shard-islands"

# THE MACHINE IS SCALED TO ZERO AND THIS FILE IS NOT RUNNING ANYWHERE.
#
# Turned off on 2026-11-17: no players for months, a demo nobody was
# visiting, and no reason to keep billing for it. `fly scale count 1`
# brings it back, and the sleep settings below mean it comes back asleep
# rather than always-on. Everything here is still correct and still what a
# restored machine would run. See the banner at the top of DEPLOY.md.

# US East. A Colyseus room lives in ONE process on ONE machine, so a second
# region would be a second WORLD, not a faster route to this one — players
# in it would be alone. One region is therefore a decision about where the
# players are, not about latency, and a launch aimed at Product Hunt is
# aimed at North America.
#
# The prediction and interpolation layers exist precisely so that the
# distance costs the pilot nothing they can feel: their own craft answers
# the stick instantly, and everyone else is rendered 100ms in the past
# whether they are ten milliseconds away or a hundred.
primary_region = "iad"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "2567"
  # The point past which new arrivals are turned away and fly solo rather
  # than everyone's tick rate collapsing. Re-run roomLoadCheck after any
  # change to the machine or to the physics, and set this from the number
  # it gives rather than from optimism.
  #
  # 48 on shared-cpu-1x. Measured the day it went back on that machine: the
  # gate turned arrivals away at exactly 48, and 48 craft packed into two
  # rooms ran at 14.7 Hz. That is below the 16 Hz the game was developed at
  # but above the ~12 Hz where movement starts to look choppy, so playable
  # rather than comfortable. A week earlier the same load spread over three
  # rooms ran at 17.3 Hz; fuller rooms cost more because every craft checks
  # every other craft's trail. It was 64 on performance-1x. Change the two
  # together.
  MAX_CONCURRENT = "48"
  # ALLOWED_ORIGINS is deliberately NOT here. It is set with `fly secrets
  # set`, so that changing where the game is served from does not require a
  # code change, and so an unset value is visible as a warning in the logs
  # rather than hidden in a committed file.

[http_service]
  internal_port = 2567
  force_https = true
  # The machine sleeps when the sky is empty and wakes on the first arrival.
  #
  # This used to be off, on the grounds that a cold start would break "no
  # visible connecting delay, ever". That reasoning was wrong, and the
  # timeline is why: beginJoin() fires the moment the pane is struck, and
  # the player is not flying until PLUNGE_AT + PLUNGE_DURATION, which is
  # 15.8 seconds later. Nothing in the client blocks on, awaits or gates the
  # sequence behind the join. A resume is a few hundred milliseconds and a
  # full cold boot is a couple of seconds, so both land during the fall,
  # with seconds to spare, and the player sees nothing.
  #
  # "suspend" rather than "stop": it keeps the memory image, so waking is a
  # resume rather than a boot. Fly bills them the same. Fly can still fall
  # back to a cold boot after a deploy, a host migration or capacity
  # pressure, which is fine — the fall covers that too, and it is the case
  # worth testing after any change here.
  #
  # Open sockets count as live traffic, so nobody is ever disconnected
  # mid-flight; the machine only sleeps once the last player has left.
  auto_stop_machines = "suspend"
  # Explicit, and it has to stay explicit: autostart has been reported not
  # to fire without it alongside a suspend setting.
  auto_start_machines = true
  # THE LINE THAT DOES THE WORK. At 1, autostop never stops the last
  # machine and the setting above achieves nothing at all.
  min_machines_running = 0

  # EXACTLY ONE MACHINE. Not a cost decision — a correctness one.
  #
  # A Colyseus room lives in one process, and this server runs the default
  # local presence and matchmaking drivers, so a second machine is a second
  # set of rooms that knows nothing about the first. Two players balanced
  # onto different machines would be in different worlds, each convinced
  # they were alone, with nothing in the game to suggest why.
  #
  # The launcher created two and it looked perfectly healthy: both machines
  # up, both health checks passing. `fly scale count 1` is what fixed it.
  #
  # Lifting this needs shared presence (Redis) and a matchmaking driver
  # behind it, not just a bigger number here.

  [http_service.concurrency]
    # Connections, not requests: every player is one long-lived socket, so
    # request-based limits would read as almost no load at all.
    type = "connections"
    # The room caps itself at 24, and one machine can host several rooms.
    # These are the numbers at which Fly should stop sending new arrivals
    # here, not a cap on the game.
    soft_limit = 180
    hard_limit = 240

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/health"

[[vm]]
  # THIS MUST MATCH THE RUNNING MACHINE. `fly deploy` applies whatever is
  # written here, so a stale size here silently resizes production on the
  # next deploy — which, on a launch day, is the worst possible moment to
  # find out.
  #
  # Back on the small shared machine, deliberately.
  #
  # It spent a week on performance-1x (a dedicated core, 2GB) in case a
  # Product Hunt launch brought a crowd. That machine bills for being
  # switched on, not for players, and it came to about $1 a day on a site
  # almost nobody was using yet. It also bought very little: measured
  # against production, 17.32 -> 18.12 Hz at 48 craft, with the collapse
  # point unmoved, because the ceiling is the cost of the physics rather
  # than the hardware. The server used around 168MB of its 2GB.
  #
  # FOR A LAUNCH: scale up the day before, then change BOTH of these lines
  # and MAX_CONCURRENT above to match, or the next deploy puts it back.
  #   fly scale vm performance-1x --vm-memory 2048 -a shard-islands
  size = "shared-cpu-1x"
  memory = "512mb"
